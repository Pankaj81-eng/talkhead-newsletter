name: TalkHead Daily

# Triggered externally by cron-job.org hitting this workflow's
# workflow_dispatch API endpoint every morning -- same pattern ai-daily
# uses and for the same reason (GitHub's own `schedule` trigger has a
# history of firing unreliably/late), but a SEPARATE cron-job.org job
# from ai-daily's (Pankaj's explicit call, 2026-09-05): same account,
# independent job entries, so pausing or deleting either project's
# automation never touches the other's.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD, defaults to today"
        type: string
        default: ""

concurrency:
  group: talkhead-daily
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit state/published_log.json back

jobs:
  run:
    runs-on: ubuntu-latest
    # Generation (~45 min on the CPU-only runner) + a bounded Publish/Discard
    # wait (3 hours, passed to daily_run.py below) + headroom. The run ends
    # as soon as a decision arrives, so the long window only costs runner
    # minutes on days the decision is actually slow. GitHub's hosted-runner
    # ceiling is 360 min.
    timeout-minutes: 270

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        # Same apt-daily.timer lock workaround as ai-daily's own workflow
        # (read-only reference) -- Ubuntu runners can otherwise hang
        # silently on the very first apt-get call.
        timeout-minutes: 5
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          timeout 60 bash -c 'while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; do sleep 2; done' || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TalkHead dependencies
        run: uv sync --frozen

      - name: Run the daily pipeline
        env:
          # NOT secrets -- plain pipeline config, but still had to be set
          # explicitly here: confirmed the hard way (2026-09-05) that
          # without this, config.py's os.getenv() falls back to its
          # hardcoded "kokoro" default in the cloud (no committed .env
          # for load_dotenv() to read here, unlike the local Mac setup),
          # silently using a generic pre-built voice instead of Pankaj's
          # actual clone -- the video was otherwise fine, just not his
          # voice. FACTORY_VOICE_SEED matches the take already approved
          # and pinned for real use in the sibling techtales-factory
          # project's own .env.
          FACTORY_VOICE_ENGINE: chatterbox
          FACTORY_VOICE_SEED: "1965803137"
          # Explicit as of 2026-09-07 -- these were previously UNSET here,
          # silently falling back to config.py's own defaults (which
          # happen to already be 85/90) rather than being a deliberate,
          # documented choice. Matches TikTok's own guidance that 60-90s
          # is their promoted range. Made explicit, not changed.
          FACTORY_SAFE_MAX_SECONDS: "85"
          FACTORY_HARD_MAX_SECONDS: "90"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
          WOOP_API_KEY: ${{ secrets.WOOP_API_KEY }}
          WOOP_PROJECT_ID: ${{ secrets.WOOP_PROJECT_ID }}
          WOOP_LINKEDIN_ACCOUNT_ID: ${{ secrets.WOOP_LINKEDIN_ACCOUNT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          uv run python scripts/daily_run.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            --decision-timeout 10800

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talkhead-run-${{ github.run_id }}
          path: |
            runs/**/final.mp4
            runs/**/thumbnail.jpg
            runs/**/metadata.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit updated published_log.json
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update published_log.json [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push rejected (attempt $attempt/3) -- pulling and retrying"
              git pull --rebase
            done
          else
            echo "No state change to commit."
          fi
