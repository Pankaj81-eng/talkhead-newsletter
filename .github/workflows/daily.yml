name: TalkHead Daily

# Triggered externally by cron-job.org hitting this workflow's
# workflow_dispatch API endpoint every morning -- same pattern ai-daily
# uses and for the same reason (GitHub's own `schedule` trigger has a
# history of firing unreliably/late), but a SEPARATE cron-job.org job
# from ai-daily's (Pankaj's explicit call, 2026-09-05): same account,
# independent job entries, so pausing or deleting either project's
# automation never touches the other's.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD, defaults to today"
        type: string
        default: ""

concurrency:
  group: talkhead-daily
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit state/published_log.json back

jobs:
  run:
    # 2026-10-22: while the repo variable LOCAL_RUN is "true", the daily run happens on Pankaj's Mac
    # (scripts/local_run.sh) and this job is skipped, which costs no Actions minutes. Back to GitHub:
    #   gh variable set LOCAL_RUN --body false --repo Pankaj81-eng/talkhead-newsletter
    if: ${{ vars.LOCAL_RUN != 'true' }}
    runs-on: ubuntu-latest
    # Generation (~45 min on the CPU-only runner) + a bounded Publish/Discard
    # wait (4 hours, passed to daily_run.py below) + headroom. The run ends
    # as soon as a decision arrives, so the long window only costs runner
    # minutes on days the decision is actually slow. GitHub's hosted-runner
    # ceiling is 360 min.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        # Same apt-daily.timer lock workaround as ai-daily's own workflow
        # (read-only reference) -- Ubuntu runners can otherwise hang
        # silently on the very first apt-get call.
        # 2026-10-22: the install hung past 5 minutes once and killed the whole morning run, so each
        # try is now capped at 2.5 minutes and repeated up to 3 times before the step gives up.
        timeout-minutes: 10
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          timeout 60 bash -c 'while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; do sleep 2; done' || true
          for try in 1 2 3; do
            if timeout 150 bash -c 'sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && sudo apt-get install -y -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg'; then break; fi
            echo "apt try $try failed or timed out"; [ "$try" = 3 ] && exit 1
            sudo killall apt-get dpkg 2>/dev/null || true; sleep 5
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TalkHead dependencies
        run: uv sync --frozen

      - name: Run the daily pipeline
        env:
          # NOT secrets -- plain pipeline config, but still had to be set
          # explicitly here: confirmed the hard way (2026-09-05) that
          # without this, config.py's os.getenv() falls back to its
          # hardcoded "kokoro" default in the cloud (no committed .env
          # for load_dotenv() to read here, unlike the local Mac setup),
          # silently using a generic pre-built voice instead of Pankaj's
          # actual clone -- the video was otherwise fine, just not his
          # voice. FACTORY_VOICE_SEED matches the take already approved
          # and pinned for real use in the sibling techtales-factory
          # project's own .env.
          FACTORY_VOICE_ENGINE: chatterbox
          FACTORY_VOICE_SEED: "1965803137"
          # Explicit as of 2026-09-07 -- these were previously UNSET here,
          # silently falling back to config.py's own defaults (which
          # happen to already be 85/90) rather than being a deliberate,
          # documented choice. Matches TikTok's own guidance that 60-90s
          # is their promoted range. Made explicit, not changed.
          # 2026-10-08: shorter narration (36-45s, ~95-117 words) after YouTube
          # analytics showed most viewers leave within 20-30s; total video with
          # intro/outro lands around 45-55s.
          FACTORY_MIN_SECONDS: "36"
          FACTORY_SAFE_MAX_SECONDS: "45"
          FACTORY_HARD_MAX_SECONDS: "50"
          # 2026-10-13: no extra speed-up (it was 1.15 by default and sounded rushed); at the natural
          # pace about 2.4 words/sec, so the same 36-45s budget means ~86-108 words.
          FACTORY_VOICE_SPEED: "1.0"
          FACTORY_WORDS_PER_SECOND: "2.4"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
          WOOP_API_KEY: ${{ secrets.WOOP_API_KEY }}
          WOOP_PROJECT_ID: ${{ secrets.WOOP_PROJECT_ID }}
          WOOP_LINKEDIN_ACCOUNT_ID: ${{ secrets.WOOP_LINKEDIN_ACCOUNT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          uv run python scripts/daily_run.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            --decision-timeout 14400

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talkhead-run-${{ github.run_id }}
          path: |
            runs/**/final.mp4
            runs/**/thumbnail.jpg
            runs/**/metadata.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Instagram scorecard
        # Read-only: records today's per-Reel numbers in state/analytics_instagram.json
        # (committed by the next step) and, on Mondays, sends the weekly summary to
        # Telegram. Never fails the run.
        if: always()
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YT_ANALYTICS_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python scripts/scorecard.py --snapshot --weekly-on-monday

      - name: Renew Instagram token
        # Sundays only: refreshes the 60-day Instagram token and stores the new one back into the
        # GitHub secret IG_ACCESS_TOKEN (needs the GH_PAT secret). Never fails the run; warns on Telegram.
        if: always()
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python scripts/refresh_ig_token.py --weekly-on-sunday

      - name: Weekly creator brief
        # Sundays only: three ideas for Pankaj's weekly deeper video, sent to Telegram.
        if: always()
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python scripts/creator_brief.py --weekly-on-sunday --send

      - name: Commit updated published_log.json
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update published_log.json [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push rejected (attempt $attempt/3) -- pulling and retrying"
              git pull --rebase
            done
          else
            echo "No state change to commit."
          fi
