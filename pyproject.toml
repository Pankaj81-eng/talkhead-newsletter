[project]
name = "talkhead-newsletter"
version = "0.1.0"
description = "TalkHead Newsletter video pipeline — turns an ai-daily story into a narrated Short (Phase 0 pilot)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "google-genai>=0.3.0",
    "groq>=0.9.0",
    "faster-whisper>=1.0.0",
    "pillow>=10.3",
    "soundfile>=0.12",
    "numpy>=1.26",
    "kokoro>=0.9.4",
    "chatterbox-tts>=0.1.0",
    "python-telegram-bot>=21.0",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "boto3>=1.34",
    "feedparser>=6.0",
    # Pinned below 81: newer setuptools dropped bundling pkg_resources by
    # default, which a dependency three layers deep (resemble-perth, used
    # by chatterbox-tts for audio watermarking) still imports directly.
    # Without this, ChatterboxTTS.from_pretrained() crashes with
    # "TypeError: 'NoneType' object is not callable" on its watermarker.
    "setuptools<81",
]

[tool.uv]
dev-dependencies = ["pytest>=8.0"]
